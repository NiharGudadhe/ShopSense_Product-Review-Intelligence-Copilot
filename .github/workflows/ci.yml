# Runs on every push and pull request: lint, then the tests. NOT YET RUN on GitHub; check the Actions tab after the first push.
name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (light: tests need no model, no index and no Ollama)
        run: pip install pytest ruff pandas numpy pyarrow requests pydantic fastapi httpx langgraph pyyaml
      - name: Lint
        run: ruff check src tests app scripts --select E9,F
      - name: Test
        run: pytest -q
